name: Android Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_apiId: ${{ secrets.UNSPLASH_API_KEY }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools not found at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/release-keystore.jks

      - name: Verify keystore
        shell: bash
        run: |
          test -f app/release-keystore.jks
          ls -lh app/release-keystore.jks

      - name: Grant permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: artgallery-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
